<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>BDI Validation and Compliance Monitoring</title>
  <desc>Build Data Interpreter analyzing asset configuration against allowable configuration, engineering changes, and maintenance requirements</desc>
  
  <defs>
    <style>
      .data-flow {
        stroke: #393939;
        stroke-width: 2;
        stroke-dasharray: 5,5;
        fill: none;
        opacity: 0.6;
      }
      .validation-flow {
        stroke: #24a148;
        stroke-width: 2.5;
        fill: none;
      }
      .node-shadow {
        filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.15));
      }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="bdiCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0353e9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="assetData" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8a3ffc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6929c4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="engineeringData" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#009d9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007d79;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="validationResult" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#24a148;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="coreGlow">
      <stop offset="0%" style="stop-color:#0f62fe;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background glow around BDI core -->
  <circle cx="200" cy="150" r="70" fill="url(#coreGlow)"/>
  
  <!-- Data flow lines (inputs to BDI) -->
  <path d="M 80 80 Q 140 115, 165 135" class="data-flow"/>
  <path d="M 320 80 Q 260 115, 235 135" class="data-flow"/>
  <path d="M 80 220 Q 140 185, 165 165" class="data-flow"/>
  <path d="M 320 220 Q 260 185, 235 165" class="data-flow"/>
  
  <!-- Validation output flows -->
  <path d="M 200 190 L 200 240" class="validation-flow" stroke-linecap="round"/>
  <path d="M 200 240 L 195 232 M 200 240 L 205 232" class="validation-flow" stroke-linecap="round"/>
  
  <!-- Input Sources (Top) -->
  <!-- Engineering Reference Data (Top Left) -->
  <g class="node-shadow">
    <rect x="40" y="60" width="80" height="40" rx="8" 
          fill="url(#engineeringData)" stroke="#007d79" stroke-width="2"/>
    <path d="M 55 75 L 65 75 L 65 85 L 55 85 Z M 70 75 L 80 75 L 80 85 L 70 85 Z M 85 75 L 95 75 L 95 85 L 85 85 Z" 
          fill="#ffffff" opacity="0.4"/>
    <rect x="55" y="90" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.4"/>
  </g>
  
  <!-- Maintenance Requirements (Top Right) -->
  <g class="node-shadow">
    <rect x="280" y="60" width="80" height="40" rx="8" 
          fill="url(#engineeringData)" stroke="#007d79" stroke-width="2"/>
    <circle cx="305" cy="80" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <path d="M 305 75 L 305 85 M 300 80 L 310 80" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <circle cx="335" cy="80" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <path d="M 332 77 L 338 83 M 332 83 L 338 77" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Input Sources (Bottom) -->
  <!-- As-Built Configuration (Bottom Left) -->
  <g class="node-shadow">
    <rect x="40" y="200" width="80" height="40" rx="8" 
          fill="url(#assetData)" stroke="#6929c4" stroke-width="2"/>
    <rect x="55" y="212" width="50" height="16" rx="3" fill="#ffffff" opacity="0.3"/>
    <circle cx="65" cy="220" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="75" cy="220" r="3" fill="#ffffff" opacity="0.6"/>
    <circle cx="85" cy="220" r="3" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Operational History (Bottom Right) -->
  <g class="node-shadow">
    <rect x="280" y="200" width="80" height="40" rx="8" 
          fill="url(#assetData)" stroke="#6929c4" stroke-width="2"/>
    <path d="M 295 215 L 300 220 L 295 225 M 300 220 L 345 220" 
          stroke="#ffffff" stroke-width="2" opacity="0.4" fill="none" stroke-linecap="round"/>
    <circle cx="310" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="320" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="330" cy="220" r="2" fill="#ffffff" opacity="0.6"/>
  </g>
  
  <!-- Central BDI Core (Hexagonal processor) -->
  <g class="node-shadow">
    <path d="M 200 110 L 240 130 L 240 170 L 200 190 L 160 170 L 160 130 Z" 
          fill="url(#bdiCore)" stroke="#0353e9" stroke-width="3"/>
    
    <!-- Inner processing elements -->
    <circle cx="200" cy="150" r="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <circle cx="200" cy="150" r="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
    <circle cx="200" cy="150" r="5" fill="#ffffff" opacity="0.7"/>
    
    <!-- Processing indicators -->
    <path d="M 185 140 L 195 150 L 185 160" stroke="#ffffff" stroke-width="2" 
          opacity="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 215 140 L 205 150 L 215 160" stroke="#ffffff" stroke-width="2" 
          opacity="0.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Validation Output (Bottom Center) -->
  <g class="node-shadow">
    <rect x="160" y="250" width="80" height="35" rx="8" 
          fill="url(#validationResult)" stroke="#198038" stroke-width="2.5"/>
    
    <!-- Checkmark symbol -->
    <path d="M 185 267 L 193 275 L 215 255" stroke="#ffffff" stroke-width="3" 
          fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Status indicators -->
    <circle cx="170" cy="260" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="230" cy="260" r="3" fill="#ffffff" opacity="0.7"/>
  </g>
  
  <!-- Decorative data particles -->
  <circle cx="130" cy="100" r="2" fill="#009d9a" opacity="0.4"/>
  <circle cx="270" cy="100" r="2" fill="#009d9a" opacity="0.4"/>
  <circle cx="130" cy="200" r="2" fill="#8a3ffc" opacity="0.4"/>
  <circle cx="270" cy="200" r="2" fill="#8a3ffc" opacity="0.4"/>
  <circle cx="150" cy="150" r="2" fill="#0f62fe" opacity="0.3"/>
  <circle cx="250" cy="150" r="2" fill="#0f62fe" opacity="0.3"/>
</svg>
